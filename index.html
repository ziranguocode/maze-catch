<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Maze Catch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --night: #16181D;
    --floor: #1E2129;
    --wall: #7FA6DE;
    --cream: #F4EFE6;
    --muted: #A9ADB8;
    --catcher: #FF4D4D;
    --panel: #252933;
    --cap: #343946;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night);
    color: var(--cream);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding-block: 12px; overflow-x: hidden; overflow-y: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #hud { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 8px;
    background: var(--panel); border: 2px solid transparent; border-radius: 10px;
    padding: 6px 12px; width: 150px;
  }
  .chip.catcher { border-color: var(--catcher); }
  .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .chip b { display: block; font-size: 15px; }
  .chip small { color: var(--muted); font-size: 12px; }
  .chip .wins { font-weight: 700; color: var(--wall); }
  .caps { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 24px); gap: 2px; justify-content: center; }
  .cap {
    height: 24px; display: flex; align-items: center; justify-content: center;
    background: var(--cap); color: var(--cream); border-radius: 5px;
    font-size: 13px; font-weight: 700; line-height: 1;
  }
  .cap.up { grid-column: 2; }
  .cap.left { grid-column: 1; }
  .cap.down-on { background: var(--cream); color: var(--night); }
  .tag { grid-column: 1 / -1; text-align: center; font-size: 12px; font-weight: 700; color: var(--night);
         background: var(--wall); border-radius: 5px; padding: 3px 0; }
  .tag.away { background: var(--cap); color: var(--muted); }
  .orarrows { grid-column: 1 / -1; text-align: center; font-size: 11px; color: var(--muted); margin-top: -2px; }
  #arena { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .pads { display: flex; flex-direction: column; gap: 14px; }
  .pads:empty { display: none; }
  .pad {
    position: relative; width: 150px; height: 150px; border-radius: 50%; flex: none;
    border: 4px solid var(--c); background: radial-gradient(circle, #2B303B 0 55%, #22262F 56%);
    touch-action: none;
  }
  .pad .knob {
    position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%;
    background: var(--c); box-shadow: 0 3px 10px rgba(0, 0, 0, .5); pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--night); font-weight: 800; font-size: 13px;
  }
  .pad .ar { position: absolute; color: var(--muted); font-size: 18px; line-height: 1; pointer-events: none; opacity: .7; }
  .pad .ar.U { top: 6%; left: 50%; transform: translateX(-50%); }
  .pad .ar.D { bottom: 6%; left: 50%; transform: translateX(-50%); }
  .pad .ar.L { left: 7%; top: 50%; transform: translateY(-50%); }
  .pad .ar.R { right: 7%; top: 50%; transform: translateY(-50%); }
  .pad[data-dir="U"] .ar.U, .pad[data-dir="D"] .ar.D, .pad[data-dir="L"] .ar.L, .pad[data-dir="R"] .ar.R { color: var(--c); opacity: 1; }
  #stage { position: relative; line-height: 0; }
  canvas { display: block; border-radius: 8px; }
  #banner {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(22, 24, 29, .92); border: 2px solid var(--wall); border-radius: 10px;
    padding: 8px 16px; font-size: 18px; line-height: 1.3; font-weight: 600;
    text-align: center; white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #banner.on { opacity: 1; }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(22, 24, 29, .88); border-radius: 8px; line-height: 1.4; padding: 16px; text-align: center;
    overflow-y: auto;
  }
  #overlay > div { margin: auto; }
  #overlay.hide { display: none; }
  #overlay h1 { font-size: 44px; line-height: 1.1; margin: 0 0 6px; color: var(--wall); }
  #overlay h2 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; color: var(--wall); }
  #overlay p { margin: 6px auto; max-width: 560px; }
  #count { font-size: 110px; font-weight: 800; color: var(--cream); line-height: 1; }
  .pick { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
  button {
    font: inherit; font-weight: 700; color: var(--cream); background: var(--panel);
    border: 2px solid var(--wall); border-radius: 10px; padding: 10px 18px; cursor: pointer;
    touch-action: manipulation;
  }
  button.sel { background: var(--wall); color: var(--night); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }
  input {
    font: inherit; font-size: 22px; font-weight: 800; letter-spacing: .25em; text-transform: uppercase; text-align: center;
    width: 140px; padding: 8px; border-radius: 10px; border: 2px solid var(--wall);
    background: var(--night); color: var(--cream); -webkit-user-select: text; user-select: text;
  }
  .code { font-size: 64px; font-weight: 800; letter-spacing: .15em; color: var(--cream); line-height: 1.1; }
  .link { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted);
          -webkit-user-select: all; user-select: all; word-break: break-all; }
  .seats { display: grid; grid-template-columns: auto auto; gap: 2px 16px; justify-content: center; margin: 8px 0; text-align: left; }
  .status { color: var(--wall); font-weight: 600; }
  .hint { color: var(--muted); font-size: 14px; }
  #bar { display: flex; gap: 24px; align-items: center; justify-content: center; min-height: 26px; flex-wrap: wrap; }
  #bar .c { color: var(--catcher); font-weight: 700; }
  #bar .r { color: var(--wall); font-weight: 700; }
  #timer { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 20px; }
</style>
</head>
<body>
  <div id="hud"></div>
  <div id="arena">
    <div class="pads" id="padsL"></div>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="banner"></div>
      <div id="overlay"></div>
    </div>
    <div class="pads" id="padsR"></div>
  </div>
  <div id="bar"></div>

<script>
// ---------- The numbers you can change ----------
const COLS = 17, ROWS = 11;       // size of the maze
const BASE_SPEED = 5;             // squares per second at 100%
const TUNNEL_ROWS = [3, 7];       // gaps in the left and right walls
const TUNNEL_COLS = [4, 12];      // gaps in the top and bottom walls
const ROUND_TIME = 90;            // seconds. If time runs out, the runners win
const HEAD_START = 1.5;           // seconds the first catcher waits after GO
const CAUGHT_WAIT = 1.2;          // seconds a newly caught player waits
const CATCH_DISTANCE = 0.55;      // how close counts as a catch, in squares
const BODY_SIZE = 0.7;            // how close team-mates can get before they bump, in squares
const PUSH_FACTOR = 0.5;          // pushing speed: 0.5 is half speed for both players
const PAD_DEAD_ZONE = 0.12;       // touch pad: how far from the middle before it counts, 0 to 0.5
const MAX_GUESTS = 3;             // online: how many other devices can join
const SNAPS_PER_SECOND = 30;      // online: how often the host sends the game to the others

// How fast each side moves, by how many catchers there are.
// More catchers means slower catchers and faster runners.
const SPEEDS = {
  1: { catcher: 1.15, runner: 1.00 },
  2: { catcher: 0.92, runner: 1.12 },
  3: { catcher: 0.80, runner: 1.25 },
};

// All four sets are the same shape: top key is up, bottom row is left, down, right.
// order is where the keys sit along the keyboard, left to right, so the screen matches the hands.
const PLAYERS = [
  { name: 'Blue',   color: '#4FA8FF', order: 1,
    keys: { KeyW: 'U', KeyS: 'D', KeyA: 'L', KeyD: 'R' } },
  { name: 'Green',  color: '#4ADE80', order: 2,
    keys: { KeyY: 'U', KeyH: 'D', KeyG: 'L', KeyJ: 'R' } },
  { name: 'Orange', color: '#FFB02E', order: 4,
    keys: { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R' } },
  { name: 'Pink',   color: '#F472D0', order: 3,
    keys: { KeyP: 'U', Semicolon: 'D', KeyL: 'L', Quote: 'R' } },
];

// ---------- Maze ----------
const BIT = { U: 1, R: 2, D: 4, L: 8 };
const DX = { U: 0, R: 1, D: 0, L: -1 };
const DY = { U: -1, R: 0, D: 1, L: 0 };
const OPP = { U: 'D', R: 'L', D: 'U', L: 'R' };
const DIRS = ['U', 'R', 'D', 'L'];

function inside(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }
function shuffled(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// The map wraps: off one edge means on at the opposite edge.
function wrapX(x) { return (x + COLS) % COLS; }
function wrapY(y) { return (y + ROWS) % ROWS; }
function carve(m, x, y, d) {
  m[y][x] |= BIT[d];
  m[wrapY(y + DY[d])][wrapX(x + DX[d])] |= BIT[OPP[d]];
}
// Shortest distance between two points, counting the way through the edges.
function gap(ax, ay, bx, by) {
  const dx = Math.abs(ax - bx) % COLS, dy = Math.abs(ay - by) % ROWS;
  return Math.hypot(Math.min(dx, COLS - dx), Math.min(dy, ROWS - dy));
}
function exits(m, x, y) {
  return DIRS.filter(d => m[y][x] & BIT[d]).length;
}

function buildMaze() {
  const m = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  const seen = Array.from({ length: ROWS }, () => new Array(COLS).fill(false));
  const stack = [[0, 0]];
  seen[0][0] = true;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const d = shuffled(DIRS).find(d => inside(x + DX[d], y + DY[d]) && !seen[y + DY[d]][x + DX[d]]);
    if (!d) { stack.pop(); continue; }
    carve(m, x, y, d);
    seen[y + DY[d]][x + DX[d]] = true;
    stack.push([x + DX[d], y + DY[d]]);
  }
  // No dead ends, so a runner always has a way out and catchers must team up.
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (exits(m, x, y) !== 1) continue;
    const walls = shuffled(DIRS).filter(d => inside(x + DX[d], y + DY[d]) && !(m[y][x] & BIT[d]));
    const best = walls.find(d => exits(m, x + DX[d], y + DY[d]) === 1) || walls[0];
    if (best) carve(m, x, y, best);
  }
  // A few extra gaps make more loops to run around.
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    for (const d of ['R', 'D']) {
      if (inside(x + DX[d], y + DY[d]) && !(m[y][x] & BIT[d]) && Math.random() < 0.1) carve(m, x, y, d);
    }
  }
  for (const y of TUNNEL_ROWS) carve(m, COLS - 1, y, 'R');
  for (const x of TUNNEL_COLS) carve(m, x, ROWS - 1, 'D');
  return m;
}

// ---------- Game state ----------
let count = 3;          // 3 or 4 players
let state = 'menu';     // menu, countdown, play, over
let maze = buildMaze();
let players = [];
let wins = [0, 0, 0, 0];
let timeLeft = ROUND_TIME;
let countdown = 0;
let clock = 0;
let firstCaught = null;
let nextCatcher = null;
let bannerUntil = 0;
let rings = [];
let overTitle = '';
let roundId = 0;        // goes up each time the maze changes, so online players get the new one

function catchers() { return players.filter(p => p.role === 'catcher'); }
function runners() { return players.filter(p => p.role === 'runner'); }
function speedOf(p) {
  const n = Math.max(1, Math.min(3, catchers().length));
  return SPEEDS[n][p.role] * BASE_SPEED;
}

function startRound() {
  maze = buildMaze();
  roundId++;
  const start = nextCatcher === null ? Math.floor(Math.random() * count) : nextCatcher;
  const corners = shuffled([[0, 0], [COLS - 1, 0], [0, ROWS - 1], [COLS - 1, ROWS - 1]]);
  players = [];
  for (let i = 0; i < count; i++) {
    const isCatcher = i === start;
    const [cx, cy] = isCatcher ? [Math.floor(COLS / 2), Math.floor(ROWS / 2)] : corners.pop();
    players.push({
      i, cx, cy, dir: null, t: 0, face: 'D', held: [], queued: null, queuedAt: 0,
      pushedAt: -9, pushingAt: -9,
      role: isCatcher ? 'catcher' : 'runner', wait: isCatcher ? HEAD_START : 0,
      ...PLAYERS[i],
    });
  }
  // Keys or pads already held down keep working in the new round.
  for (const code in keyHeld) applyPress(keyHeld[code].seat, keyHeld[code].d);
  timeLeft = ROUND_TIME;
  countdown = 3;
  firstCaught = null;
  rings = [];
  overTitle = '';
  state = 'countdown';
  beep(440, .1);
  renderOverlay();
  renderHud();
}

// ---------- Moving ----------
function isOpen(x, y, d) { return (maze[y][x] & BIT[d]) !== 0; }

function chooseDir(p) {
  if (p.queued && isOpen(p.cx, p.cy, p.queued)) {
    const d = p.queued;
    p.queued = null;
    return d;
  }
  for (let i = p.held.length - 1; i >= 0; i--) {
    if (isOpen(p.cx, p.cy, p.held[i])) return p.held[i];
  }
  return null;
}

function want(p) { return p.queued || p.held[p.held.length - 1] || null; }

function turnAround(p) {
  p.cx = wrapX(p.cx + DX[p.dir]); p.cy = wrapY(p.cy + DY[p.dir]);
  p.dir = OPP[p.dir]; p.t = 1 - p.t;
}

function land(p) {
  if (p.t < 1 - 1e-9) return;
  p.cx = wrapX(p.cx + DX[p.dir]); p.cy = wrapY(p.cy + DY[p.dir]);
  p.t = 0; p.dir = null;
}

// Would a small step in direction d take b further from a?
function movesAway(b, a, d) {
  const x = posX(b), y = posY(b), ax = posX(a), ay = posY(a);
  return gap(x + DX[d] * .01, y + DY[d] * .01, ax, ay) > gap(x, y, ax, ay);
}

// The team-mate in p's way, if the next step would bump into one.
function blockerOf(p, step, skip) {
  const x = posX(p) + DX[p.dir] * step, y = posY(p) + DY[p.dir] * step;
  let found = null, nearest = BODY_SIZE;
  for (const q of players) {
    if (q === p || q.role !== p.role || (skip && skip.has(q))) continue;
    const next = gap(x, y, posX(q), posY(q));
    const now = gap(posX(p), posY(p), posX(q), posY(q));
    if (next < nearest && next < now) { nearest = next; found = q; }
  }
  return found;
}

// Is b pushing back against a? Then neither of them moves.
function pushesBack(b, a) {
  if (b.wait > 0) return false;
  const w = want(b);
  if (!w) return false;
  if (b.dir ? (w !== b.dir && w !== OPP[b.dir]) : !isOpen(b.cx, b.cy, w)) return false;
  return !movesAway(b, a, w);
}

// a pushes b along by dist. Returns how far b really moved.
// b stays on the paths: at a wall it slides round the corner like a rock in a chute.
function shove(b, a, dist, seen) {
  seen.add(b);
  if (pushesBack(b, a)) return 0;
  if (b.dir) {
    if (!movesAway(b, a, b.dir)) turnAround(b);
  } else {
    const ways = DIRS.filter(d => isOpen(b.cx, b.cy, d) && movesAway(b, a, d));
    const d = ways.includes(a.dir) ? a.dir : ways[0];
    if (!d) return 0;
    b.dir = d; b.t = 0;
  }
  dist = Math.min(dist, 1 - b.t);
  const next = blockerOf(b, dist, seen);
  if (next) dist = shove(next, b, dist, seen);
  if (dist <= 0) {
    if (b.t === 0) b.dir = null;
    return 0;
  }
  b.t += dist;
  b.pushedAt = clock;
  land(b);
  return dist;
}

function move(p, dt) {
  if (clock - p.queuedAt > 0.3) p.queued = null;
  if (p.wait > 0) { p.wait -= dt; return; }
  let left = speedOf(p) * dt;
  let slowed = clock - p.pushedAt < .12;   // being pushed slows you down too
  if (slowed && !want(p)) return;          // a rock only moves when pushed
  if (slowed) left *= PUSH_FACTOR;
  for (let guard = 0; left > 1e-6 && guard < 10; guard++) {
    if (p.dir) {
      if (want(p) === OPP[p.dir]) {        // turn around in the middle of a square
        turnAround(p);
        p.face = p.dir;
        if (p.queued === p.dir) p.queued = null;
      }
      let step = Math.min(left, 1 - p.t);
      const blocker = blockerOf(p, step);
      if (blocker) {
        if (!want(p)) break;               // only push if a key is held
        if (!slowed) { slowed = true; left *= PUSH_FACTOR; step = Math.min(left, 1 - p.t); }
        step = shove(blocker, p, step, new Set([p]));
        if (step <= 0) {
          if (p.t === 0) p.dir = null;
          break;
        }
        p.pushingAt = clock;
      }
      p.t += step; left -= step;
      land(p);
    } else {
      const d = chooseDir(p);
      if (!d) break;
      p.dir = d; p.face = d; p.t = 0;
    }
  }
}

function posX(p) { return p.cx + (p.dir ? DX[p.dir] * p.t : 0); }
function posY(p) { return p.cy + (p.dir ? DY[p.dir] * p.t : 0); }

function checkCatches() {
  for (const c of catchers()) {
    if (c.wait > 0) continue;
    for (const r of runners()) {
      if (gap(posX(c), posY(c), posX(r), posY(r)) < CATCH_DISTANCE) caught(r);
    }
  }
}

function caught(r) {
  r.role = 'catcher';
  r.wait = CAUGHT_WAIT;
  if (firstCaught === null) firstCaught = r.i;
  rings.push({ x: posX(r), y: posY(r), age: 0, color: r.color });
  beep(220, .18); beep(330, .18, .1);
  renderHud();
  const left = runners().length;
  if (left === 0) { endRound(r); return; }
  showBanner(`${r.name} is caught! Catchers slow down, runners speed up.`);
}

function endRound(lastCaught) {
  state = 'over';
  const left = runners();
  if (lastCaught) {
    wins[lastCaught.i]++;
    overTitle = `${lastCaught.name} lasted the longest and wins!`;
  } else {
    left.forEach(p => wins[p.i]++);
    overTitle = `Time is up! ${left.map(p => p.name).join(' and ')} got away!`;
  }
  // First player caught starts as the catcher next round.
  const pick = firstCaught !== null ? firstCaught : (catchers()[0].i + 1) % count;
  nextCatcher = pick;
  renderOverlay();
  renderHud();
  beep(523, .15); beep(659, .15, .15); beep(784, .3, .3);
}

function update(dt) {
  clock += dt;
  for (const ring of rings) ring.age += dt;
  rings = rings.filter(r => r.age < .7);
  tickBanner();
  if (state === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt;
    if (countdown <= 0) {
      state = 'play';
      renderOverlay();
      showBanner(`Go! ${catchers()[0].name} is the catcher.`);
      beep(880, .25);
    } else if (Math.ceil(countdown) !== before) {
      beep(440, .1);
      renderOverlay();
    }
    return;
  }
  if (state !== 'play') return;
  timeLeft -= dt;
  for (const p of players) move(p, dt);
  checkCatches();
  if (state === 'play' && timeLeft <= 0) { timeLeft = 0; endRound(null); }
  renderBar();
}

// ---------- Who controls which player ----------
// A seat is one player: 0 Blue, 1 Green, 2 Orange, 3 Pink.
// Offline, this device has every seat. Online, the host gives seats to the other devices.
function localSeats() {
  const all = [0, 1, 2, 3].slice(0, count);
  if (net.mode === 'guest') return net.mySeats.filter(s => s < count);
  if (net.mode === 'host') return all.filter(s => owner[s] === 'host');
  return all;
}
function isLocal(seat) { return localSeats().includes(seat); }

// Every press and let-go goes through here, from keys, touch pads, or the network.
function pressDir(seat, d) {
  if (net.mode === 'guest') { sendToHost({ t: 'in', seat, d, down: true }); return; }
  applyPress(seat, d);
}
function releaseDir(seat, d) {
  if (net.mode === 'guest') { sendToHost({ t: 'in', seat, d, down: false }); return; }
  applyRelease(seat, d);
}
function applyPress(seat, d) {
  const p = players[seat];
  if (!p) return;
  p.held = p.held.filter(x => x !== d);
  p.held.push(d);
  p.queued = d;
  p.queuedAt = clock;
}
function applyRelease(seat, d) {
  const p = players[seat];
  if (!p) return;
  p.held = p.held.filter(x => x !== d);
}

// ---------- Keys ----------
const CAP_TEXT = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Semicolon: ';', Quote: "'" };
const capText = code => CAP_TEXT[code] || code.replace('Key', '');
const keysDown = new Set();
const keyHeld = {};     // which seat and direction each held key is moving, so letting go undoes the same thing
function lightCap(code, on) {
  if (on) keysDown.add(code); else keysDown.delete(code);
  const cap = document.getElementById('cap-' + code);
  if (cap) cap.classList.toggle('down-on', on);
}
const taken = {};
PLAYERS.forEach((pl, i) => { for (const code in pl.keys) taken[code] = { i, d: pl.keys[code] }; });

// If this device has just one player, both W A S D and the arrow keys move it.
// Otherwise each player uses the keys of their own colour.
function keyMap() {
  const seats = localSeats(), map = {};
  if (seats.length === 1) {
    for (const set of [PLAYERS[0].keys, PLAYERS[2].keys]) for (const code in set) map[code] = { seat: seats[0], d: set[code] };
  } else {
    for (const s of seats) for (const code in PLAYERS[s].keys) map[code] = { seat: s, d: PLAYERS[s].keys[code] };
  }
  return map;
}
function canRunGame() { return net.mode !== 'guest'; }

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.tagName === 'INPUT') {            // typing a join code
    if (e.key === 'Enter') joinGame(e.target.value);
    return;
  }
  wakeSound();
  const k = keyMap()[e.code];
  if (k || taken[e.code] || e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  if (k) lightCap(e.code, true);
  if (e.code === 'KeyM') { muted = !muted; renderOverlay(); return; }
  if (state === 'menu' && canRunGame() && menuView === 'main') {
    if (e.code === 'Digit3') setCount(3);
    if (e.code === 'Digit4') setCount(4);
  }
  if ((e.code === 'Space' || e.code === 'Enter') && (state === 'menu' || state === 'over') && canRunGame() && menuView === 'main') {
    startRound();
    return;
  }
  if (e.code === 'Escape') {
    if (net.mode === 'guest') { leaveOnline('You left the game.'); return; }
    if (state !== 'menu') { backToMenu(); return; }
  }
  if (!k) return;
  keyHeld[e.code] = k;
  pressDir(k.seat, k.d);
});
addEventListener('keyup', e => {
  lightCap(e.code, false);
  const k = keyHeld[e.code];
  if (!k) return;
  delete keyHeld[e.code];
  releaseDir(k.seat, k.d);
});
addEventListener('blur', releaseEverything);

function releaseEverything() {
  [...keysDown].forEach(code => lightCap(code, false));
  for (const code in keyHeld) { releaseDir(keyHeld[code].seat, keyHeld[code].d); delete keyHeld[code]; }
  document.querySelectorAll('.pad').forEach(pad => pad.letGo && pad.letGo());
  if (net.mode !== 'guest') players.forEach(p => { p.held = []; p.queued = null; });
}

function setCount(n) {
  count = n;
  if (net.mode === 'host') balanceSeats();
  renderOverlay();
  renderHud();
}

function backToMenu() {
  state = 'menu';
  players = [];
  wins = [0, 0, 0, 0];
  nextCatcher = null;
  maze = buildMaze();
  roundId++;
  renderOverlay();
  renderHud();
  renderBar();
}

// ---------- Touch pads ----------
// A pad works like a joystick: put a finger on it and slide towards where you want to go.
// Each pad follows only one finger, so four people can play on one iPad.
let touchMode = navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches;
addEventListener('pointerdown', e => {
  wakeSound();
  if (e.pointerType === 'touch' && !touchMode) { touchMode = true; renderHud(); }
}, true);
document.addEventListener('gesturestart', e => e.preventDefault());       // no pinch zoom on iPad
document.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('.pad')) e.preventDefault(); }, { passive: false });

function showPads() { return touchMode && state !== 'menu' && players.length > 0; }

let padSig = '';
function renderPads() {
  const seats = showPads() ? localSeats().slice().sort((a, b) => PLAYERS[a].order - PLAYERS[b].order) : [];
  const sig = seats.join(',');
  if (sig === padSig) return;                     // only rebuild when the seats change, so fingers stay put
  padSig = sig;
  document.querySelectorAll('.pad').forEach(pad => pad.letGo && pad.letGo());
  const half = Math.ceil(seats.length / 2);
  const make = s => `<div class="pad" id="pad-${s}" style="--c:${PLAYERS[s].color}">
    <span class="ar U">▲</span><span class="ar D">▼</span><span class="ar L">◀</span><span class="ar R">▶</span>
    <div class="knob">${PLAYERS[s].name}</div></div>`;
  $('padsL').innerHTML = seats.slice(0, half).map(make).join('');
  $('padsR').innerHTML = seats.slice(half).map(make).join('');
  seats.forEach(s => attachPad($('pad-' + s), s));
}

function attachPad(el, seat) {
  const knob = el.querySelector('.knob');
  let finger = null, current = null;
  const go = d => {
    if (d === current) return;
    if (current) releaseDir(seat, current);
    current = d;
    if (d) pressDir(seat, d);
    el.dataset.dir = d || '';
  };
  const aim = e => {
    const r = el.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy), reach = r.width * .3;
    const k = len > reach ? reach / len : 1;
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    if (len < r.width * PAD_DEAD_ZONE) return go(null);
    go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  };
  el.letGo = () => { finger = null; go(null); knob.style.transform = ''; };
  const end = e => { if (e.pointerId === finger) el.letGo(); };
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (finger !== null) return;
    finger = e.pointerId;
    try { el.setPointerCapture(finger); } catch (err) { /* fine without it */ }
    aim(e);
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === finger) aim(e); });
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
}

// ---------- Online ----------
// One device is the host. It runs the game and sends it to the others about 30 times a second.
// The others only send which way their players want to go. PeerJS links the devices directly.
const PEER_PREFIX = 'ziranguo-mazecatch-';
const CODE_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';     // no I or O, so no mix-ups with 1 and 0
let net = { mode: 'local', peer: null, code: '', guests: [], conn: null, mySeats: [], free: 0, status: '' };
let owner = ['host', 'host', 'host', 'host'];         // host side: who has each seat
let menuView = 'main';                                 // main or online
let outbox = [];                                       // banners and sounds for the other devices
let snapTimer = 0;

function newCode() {
  let c = '';
  for (let i = 0; i < 4; i++) c += CODE_LETTERS[Math.floor(Math.random() * CODE_LETTERS.length)];
  return c;
}
function shareLink(code) { return location.href.split('#')[0] + '#' + code; }

let peerScript = null;
function loadPeerJs() {
  if (window.Peer) return Promise.resolve();
  if (!peerScript) peerScript = new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = ok;
    s.onerror = () => { peerScript = null; fail(); };
    document.head.appendChild(s);
  });
  return peerScript;
}
function setStatus(text) { net.status = text; renderOverlay(); }

async function hostGame() {
  setStatus('Connecting to the online server...');
  try { await loadPeerJs(); } catch (e) { setStatus('Could not load online play. Check the internet and try again.'); return; }
  tryHost(0);
}

function tryHost(attempt) {
  const code = newCode();
  const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
  peer.on('open', () => {
    net = { mode: 'host', peer, code, guests: [], conn: null, mySeats: [], free: 0, status: '' };
    owner = ['host', 'host', 'host', 'host'];
    menuView = 'main';
    backToMenu();
  });
  peer.on('connection', conn => hostAddGuest(conn));
  peer.on('disconnected', () => { if (net.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) { /* keep playing */ } } });
  peer.on('error', err => {
    if (net.peer === peer) { if (err.type === 'peer-unavailable') return; showBanner('Online trouble. The game keeps going.'); return; }
    peer.destroy();
    if (err.type === 'unavailable-id' && attempt < 5) tryHost(attempt + 1);
    else setStatus('Could not reach the online server. Check the internet and try again.');
  });
}

function seatsOf(id) { return [0, 1, 2, 3].filter(s => s < count && owner[s] === id); }
function seatNames(seats) { return seats.map(s => PLAYERS[s].name).join(' and '); }

// Hand seat s to a device. That player stops whatever the old owner was doing.
function giveSeat(s, id) {
  owner[s] = id;
  if (players[s]) { players[s].held = []; players[s].queued = null; }
  for (const code in keyHeld) if (keyHeld[code].seat === s) delete keyHeld[code];
}

// The highest seat still on the host. Seat 0 (Blue) always stays with the host.
function freeSeat(borrow) {
  for (let s = count - 1; s >= 1; s--) if (owner[s] === 'host') return s;
  if (borrow) for (let s = count - 1; s >= 1; s--) if (owner[s] !== 'host' && seatsOf(owner[s]).length > 1) return s;
  return null;
}

// Make sure every device that joined has a player, if there are enough to go round.
function balanceSeats() {
  for (let s = 0; s < 4; s++) if (s === 0 || s >= count || !net.guests.some(g => g.id === owner[s])) owner[s] = 'host';
  for (const g of net.guests) {
    if (seatsOf(g.id).length) continue;
    const s = freeSeat(true);
    if (s !== null) giveSeat(s, g.id);
  }
}

function hostAddGuest(conn) {
  let g = null;
  conn.on('open', () => {
    if (net.guests.length >= MAX_GUESTS) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); return; }
    g = { conn, id: conn.peer, round: -1 };
    net.guests.push(g);
    balanceSeats();
    const mine = seatsOf(g.id);
    showBanner(mine.length ? `${seatNames(mine)} joined from another device.` : 'Someone joined to watch.');
    renderHud();
    renderOverlay();
  });
  conn.on('data', msg => { if (g) hostOnMessage(g, msg); });
  conn.on('close', () => { if (g) hostDropGuest(g); });
  conn.on('error', () => { if (g) hostDropGuest(g); });
}

function hostOnMessage(g, msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'in') {
    if (owner[msg.seat] !== g.id || !DIRS.includes(msg.d)) return;   // only your own players
    if (msg.down) applyPress(msg.seat, msg.d); else applyRelease(msg.seat, msg.d);
  }
  if (msg.t === 'more') {
    const s = freeSeat(false);
    if (s === null) return;
    giveSeat(s, g.id);
    showBanner(`${PLAYERS[s].name} is now played on another device.`);
    renderHud();
    renderOverlay();
  }
}

function hostDropGuest(g) {
  const i = net.guests.indexOf(g);
  if (i < 0) return;
  net.guests.splice(i, 1);
  const mine = seatsOf(g.id);
  mine.forEach(s => giveSeat(s, 'host'));
  balanceSeats();
  if (mine.length) showBanner(`${seatNames(mine)} left. That player is back on this device.`);
  renderHud();
  renderOverlay();
}

const r3 = n => Math.round(n * 1000) / 1000;
function snapshot() {
  return {
    t: 'snap', st: state, count, cd: r3(countdown), tl: r3(timeLeft), clock: r3(clock), wins, round: roundId,
    title: overTitle, free: [1, 2, 3].filter(s => s < count && owner[s] === 'host').length,
    players: players.map(p => ({ cx: p.cx, cy: p.cy, dir: p.dir, t: r3(p.t), x: r3(posX(p)), y: r3(posY(p)),
      face: p.face, role: p.role, wait: r3(p.wait), pa: r3(p.pushingAt) })),
    rings: rings.map(r => ({ x: r3(r.x), y: r3(r.y), age: r3(r.age), color: r.color })),
    fx: outbox,
  };
}

function hostTick(dt) {
  snapTimer += dt;
  if (snapTimer < 1 / SNAPS_PER_SECOND) return;
  snapTimer = 0;
  if (!net.guests.length) { outbox = []; return; }
  const base = snapshot();
  for (const g of net.guests) {
    const msg = { ...base, mine: seatsOf(g.id) };
    if (g.round !== roundId) { msg.maze = maze; g.round = roundId; }     // the maze only goes when it changes
    try { g.conn.send(msg); } catch (e) { /* they will drop off */ }
  }
  outbox = [];
}

async function joinGame(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  if (code.length !== 4) { setStatus('Type the 4 letter code.'); return; }
  menuView = 'online';
  setStatus(`Joining game ${code}...`);
  try { await loadPeerJs(); } catch (e) { setStatus('Could not load online play. Check the internet and try again.'); return; }
  const peer = new Peer({ debug: 0 });
  let joined = false;
  const giveUp = text => { if (joined) return; peer.destroy(); setStatus(text); };
  const timer = setTimeout(() => giveUp('Could not connect. Check the code and the internet, then try again.'), 15000);
  peer.on('open', () => {
    const conn = peer.connect(PEER_PREFIX + code, { serialization: 'json', reliable: true });
    conn.on('open', () => {
      joined = true;
      clearTimeout(timer);
      net = { mode: 'guest', peer, code, guests: [], conn, mySeats: [], free: 0, status: '' };
      menuView = 'main';
      state = 'menu'; players = []; wins = [0, 0, 0, 0];
      renderOverlay(); renderHud();
    });
    conn.on('data', msg => {
      if (msg && msg.t === 'snap' && net.conn === conn) guestOnSnap(msg);
      if (msg && msg.t === 'full') { joined = false; clearTimeout(timer); leaveOnline('That game is full.'); }
    });
    conn.on('close', () => { if (net.conn === conn) leaveOnline('The host left.'); });
  });
  peer.on('error', err => {
    if (net.peer === peer) { if (net.mode === 'guest') leaveOnline('Lost the link to the host.'); return; }
    clearTimeout(timer);
    giveUp(err.type === 'peer-unavailable' ? 'No game with that code. Check the letters.' : 'Could not reach the online server. Check the internet and try again.');
  });
}

function sendToHost(msg) {
  if (net.conn && net.conn.open !== false) { try { net.conn.send(msg); } catch (e) { /* lost */ } }
}

function leaveOnline(text) {
  releaseEverything();
  const old = net;
  net = { mode: 'local', peer: null, code: '', guests: [], conn: null, mySeats: [], free: 0, status: text || '' };
  owner = ['host', 'host', 'host', 'host'];
  try { if (old.conn) old.conn.close(); } catch (e) { /* gone */ }
  try { if (old.peer) old.peer.destroy(); } catch (e) { /* gone */ }
  if (/^#[A-Z]{4}$/i.test(location.hash)) history.replaceState(null, '', location.href.split('#')[0]);
  menuView = 'main';
  state = 'menu'; players = []; wins = [0, 0, 0, 0]; nextCatcher = null;
  maze = buildMaze();
  renderOverlay(); renderHud(); renderBar();
}

// Guests: copy what the host sent, and slide players smoothly between snapshots.
let snapAt = 0, guestHudSig = '', guestOverlaySig = '';
function guestOnSnap(m) {
  if (m.maze) maze = m.maze;
  state = m.st; count = m.count; wins = m.wins; timeLeft = m.tl; countdown = m.cd;
  overTitle = m.title; clock = m.clock; rings = m.rings; roundId = m.round;
  net.mySeats = m.mine || []; net.free = m.free || 0;
  const old = players;
  players = m.players.map((q, i) => {
    const o = old[i];
    let fx = q.x, fy = q.y;
    if (o && o.rx !== undefined) {
      fx = o.rx; fy = o.ry;
      if (Math.abs(q.x - fx) > COLS / 2 || Math.abs(q.y - fy) > ROWS / 2) { fx = q.x; fy = q.y; }   // went through a gap
    }
    return { ...PLAYERS[i], i, cx: q.cx, cy: q.cy, dir: q.dir, t: q.t, face: q.face, role: q.role, wait: q.wait,
      pushingAt: q.pa, held: [], fromX: fx, fromY: fy, toX: q.x, toY: q.y, rx: fx, ry: fy };
  });
  snapAt = performance.now();
  for (const f of m.fx || []) {
    if (f[0] === 'b') showBannerHere(f[1]);
    if (f[0] === 's') beepHere(f[1], f[2], f[3]);
  }
  const hudSig = [state, count, wins, net.mySeats, players.map(p => p.role)].join('|');
  if (hudSig !== guestHudSig) { guestHudSig = hudSig; renderHud(); }
  const overlaySig = [state, count, Math.ceil(countdown), overTitle, net.mySeats, net.free, net.code].join('|');
  if (overlaySig !== guestOverlaySig) { guestOverlaySig = overlaySig; renderOverlay(); }
  renderBar();
}

function guestTick(dt) {
  clock += dt;
  tickBanner();
  const k = Math.min(1, (performance.now() - snapAt) / (1000 / SNAPS_PER_SECOND));
  for (const p of players) {
    p.rx = p.fromX + (p.toX - p.fromX) * k;
    p.ry = p.fromY + (p.toY - p.fromY) * k;
  }
}

// ---------- Sound ----------
let audio = null, muted = false;
function wakeSound() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  if (audio && audio.state === 'suspended') audio.resume();
}
function beep(freq, length, delay = 0) {
  if (net.mode === 'host' && net.guests.length) outbox.push(['s', freq, length, delay]);
  beepHere(freq, length, delay);
}
function beepHere(freq, length, delay = 0) {
  if (!audio || muted) return;
  const when = audio.currentTime + delay;
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(.12, when);
  gain.gain.exponentialRampToValueAtTime(.001, when + length);
  osc.connect(gain).connect(audio.destination);
  osc.start(when);
  osc.stop(when + length);
}

// ---------- Screen text ----------
const $ = id => document.getElementById(id);

function showBanner(text) {
  if (net.mode === 'host' && net.guests.length) outbox.push(['b', text]);
  showBannerHere(text);
}
function showBannerHere(text) {
  $('banner').textContent = text;
  $('banner').classList.add('on');
  bannerUntil = clock + 2.5;
}
function tickBanner() {
  if (bannerUntil && clock > bannerUntil) {
    bannerUntil = 0;
    $('banner').classList.remove('on');
  }
}

function seatList() {
  return [0, 1, 2, 3].slice(0, count).map(s => {
    const where = net.mode === 'host' ? (owner[s] === 'host' ? 'This device' : 'Another device')
      : (net.mySeats.includes(s) ? 'You' : 'Another device');
    return `<span style="color:${PLAYERS[s].color};font-weight:700">${PLAYERS[s].name}</span><span>${where}</span>`;
  }).join('');
}

function renderOverlay() {
  const o = $('overlay');
  if (state === 'play') { o.className = 'hide'; o.innerHTML = ''; return; }
  o.className = '';
  const leave = net.mode === 'guest' ? '<button id="leave">Leave</button>' : '';
  if (state === 'countdown') {
    const c = players.find(p => p.role === 'catcher');
    o.innerHTML = `<div><div id="count">${Math.max(1, Math.ceil(countdown))}</div>
      <p>${c ? `<span style="color:${c.color};font-weight:700">${c.name}</span> is the catcher. ` : ''}Everyone else, run!</p></div>`;
    return;
  }
  if (state === 'over') {
    o.innerHTML = `<div><h2>${overTitle}</h2>
      <p>First one caught starts as the catcher next round.</p>
      ${canRunGame()
        ? `<div class="pick"><button id="next">Next round</button><button id="menu">Menu</button></div>
           <p class="hint">Or press Space for the next round, Esc for the menu.</p>`
        : `<p>Waiting for the host to start the next round.</p><div class="pick">${leave}</div>`}
    </div>`;
    wire();
    return;
  }
  // The menus
  const status = net.status ? `<p class="status">${net.status}</p>` : '';
  const sound = `<button id="sound">Sound ${muted ? 'off' : 'on'}</button>`;
  if (net.mode === 'guest') {
    const mine = net.mySeats.filter(s => s < count);
    o.innerHTML = `<div>
      <h2>You are in game ${net.code}</h2>
      <p>${mine.length ? `You play ${seatNames(mine)}.` : 'No free player right now. You can watch.'}</p>
      <div class="seats">${seatList()}</div>
      <p>Waiting for the host to start.</p>
      <div class="pick">${net.free ? '<button id="more">Add another player on this device</button>' : ''}${leave}${sound}</div>
      ${status}
    </div>`;
    wire();
    return;
  }
  if (menuView === 'online') {
    o.innerHTML = `<div>
      <h2>Play online</h2>
      <p>Play with people on other computers or iPads. One device hosts the game and the others join with its code.</p>
      <div class="pick"><button id="host">Host a game</button></div>
      <p>Or type a code to join a game:</p>
      <div class="pick"><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD"><button id="join">Join</button></div>
      <div class="pick"><button id="back">Back</button></div>
      ${status}
    </div>`;
    wire();
    return;
  }
  const hosting = net.mode === 'host' ? `
    <p>Your game code</p>
    <div class="code">${net.code}</div>
    <p class="link" id="link">${shareLink(net.code)}</p>
    <div class="pick"><button id="copy">Copy link</button><button id="stop">Stop hosting</button></div>
    <div class="seats">${seatList()}</div>
    <p class="hint">Up to ${MAX_GUESTS} other devices can join with the code or the link.</p>` : '';
  o.innerHTML = `<div>
    <h1>Maze Catch</h1>
    ${net.mode === 'host' ? '' : `<p>One catcher chases everyone. Anyone caught joins the catchers.
       Each catch makes the catchers slower and the runners faster, so catchers need a plan.</p>
    <p>Team-mates block each other. Push them along like a rock, but you both go at half speed.</p>
    <p>Gaps in the outer wall take you out one side and back in the other.</p>`}
    ${hosting}
    <div class="pick">
      <button id="p3" class="${count === 3 ? 'sel' : ''}">3 players</button>
      <button id="p4" class="${count === 4 ? 'sel' : ''}">4 players</button>
    </div>
    <p>${touchMode ? 'Each player gets a touch pad next to the maze.' : 'Find your keys above. Sit in the same order as the players, left to right.'}</p>
    <div class="pick"><button id="go">Start</button>${net.mode === 'host' ? '' : '<button id="online">Play online</button>'}${sound}</div>
    ${status}
    <p class="hint">${touchMode ? 'Keys work too if a keyboard is plugged in.' : 'Press 3 or 4 to pick and Space to start. M turns the sound on or off. If the keys do nothing, click the game first.'}</p>
  </div>`;
  wire();
}

// Connect the buttons that are on screen right now.
function wire() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = () => { wakeSound(); fn(); }; };
  on('p3', () => setCount(3));
  on('p4', () => setCount(4));
  on('go', startRound);
  on('next', startRound);
  on('menu', backToMenu);
  on('sound', () => { muted = !muted; renderOverlay(); });
  on('online', () => { menuView = 'online'; net.status = ''; renderOverlay(); });
  on('back', () => { menuView = 'main'; net.status = ''; renderOverlay(); });
  on('host', hostGame);
  on('join', () => joinGame($('code').value));
  on('stop', () => leaveOnline('You stopped hosting.'));
  on('leave', () => leaveOnline('You left the game.'));
  on('more', () => sendToHost({ t: 'more' }));
  on('copy', () => {
    const link = shareLink(net.code);
    const pick = () => { const r = document.createRange(); r.selectNodeContents($('link')); getSelection().removeAllRanges(); getSelection().addRange(r); };
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => showBannerHere('Link copied.'), pick);
    else pick();
  });
}

function capsFor(seat) {
  const solo = localSeats().length === 1;
  const keys = solo ? PLAYERS[0].keys : PLAYERS[seat].keys;
  const code = d => Object.keys(keys).find(c => keys[c] === d);
  const cap = (d, cls) => `<span class="cap ${cls} ${keysDown.has(code(d)) ? 'down-on' : ''}" id="cap-${code(d)}">${capText(code(d))}</span>`;
  return `<div class="caps">${cap('U', 'up')}${cap('L', 'left')}${cap('D', '')}${cap('R', '')}</div>${solo ? '<div class="orarrows">or the arrow keys</div>' : ''}`;
}

function controlsFor(seat) {
  if (net.mode !== 'local' && !isLocal(seat)) return '<div class="tag away">Online</div>';
  if (showPads()) return '<div class="tag">Touch</div>';
  return capsFor(seat);
}

function renderHud() {
  const list = players.length ? players : PLAYERS.slice(0, count).map((p, i) => ({ ...p, i, role: null }));
  $('hud').innerHTML = list.map((p, i) => `<div class="chip ${p.role === 'catcher' ? 'catcher' : ''}" style="order:${p.order}">
    <span class="dot" style="background:${p.color}"></span>
    <span><b>${p.name}</b><small>${p.role === 'catcher' ? 'Catcher' : p.role === 'runner' ? 'Running' : 'Ready'}</small></span>
    <span class="wins">${wins[i]}</span>${controlsFor(i)}</div>`).join('');
  renderPads();
  renderBar();
  fit();
}

function renderBar() {
  if (!players.length) { $('bar').innerHTML = ''; return; }
  const n = Math.max(1, Math.min(3, catchers().length));
  const s = SPEEDS[n];
  $('bar').innerHTML = `<span class="c">Catchers ${Math.round(s.catcher * 100)}% speed</span>
    <span id="timer">${Math.ceil(timeLeft)}s</span>
    <span class="r">Runners ${Math.round(s.runner * 100)}% speed</span>`;
}

// ---------- Drawing ----------
const canvas = $('c'), ctx = canvas.getContext('2d');
let S = 40, lastFit = {};
const PAD = 4;

function fit() {
  const hudHeight = $('hud').offsetHeight;
  const pads = document.querySelectorAll('.pad');
  const perColumn = Math.max($('padsL').children.length, $('padsR').children.length, 1);
  const padSize = Math.round(Math.max(96, Math.min(170, (innerHeight - hudHeight - 70) / perColumn - 14, innerWidth * .16)));
  pads.forEach(p => { p.style.width = p.style.height = padSize + 'px'; });
  const columns = ($('padsL').children.length ? 1 : 0) + ($('padsR').children.length ? 1 : 0);
  const padsWidth = columns * (padSize + 14);
  const key = [innerWidth, innerHeight, hudHeight, padsWidth].join();
  if (S === lastFit.S && key === lastFit.key) return;
  S = Math.floor(Math.min((innerWidth - 32 - padsWidth - PAD * 2) / COLS, (innerHeight - hudHeight - 80 - PAD * 2) / ROWS));
  S = Math.max(S, 14);
  const dpr = devicePixelRatio || 1;
  const w = COLS * S + PAD * 2, h = ROWS * S + PAD * 2;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lastFit = { S, key };
}
addEventListener('resize', fit);

function drawMaze() {
  ctx.fillStyle = '#1E2129';
  ctx.fillRect(0, 0, COLS * S + PAD * 2, ROWS * S + PAD * 2);
  ctx.strokeStyle = '#7FA6DE';
  ctx.lineWidth = Math.max(3, S * .09);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const l = PAD + x * S, t = PAD + y * S;
    if (!isOpen(x, y, 'U')) { ctx.moveTo(l, t); ctx.lineTo(l + S, t); }
    if (!isOpen(x, y, 'L')) { ctx.moveTo(l, t); ctx.lineTo(l, t + S); }
    if (y === ROWS - 1 && !isOpen(x, y, 'D')) { ctx.moveTo(l, t + S); ctx.lineTo(l + S, t + S); }
    if (x === COLS - 1 && !isOpen(x, y, 'R')) { ctx.moveTo(l + S, t); ctx.lineTo(l + S, t + S); }
  }
  ctx.stroke();
}

// Near an edge a player shows on both sides as they pass through the gap.
function drawPlayer(p) {
  const px = p.rx !== undefined ? p.rx : posX(p), py = p.ry !== undefined ? p.ry : posY(p);
  drawBody(p, px, py);
  if (px < 0) drawBody(p, px + COLS, py);
  if (px > COLS - 1) drawBody(p, px - COLS, py);
  if (py < 0) drawBody(p, px, py + ROWS);
  if (py > ROWS - 1) drawBody(p, px, py - ROWS);
}

function drawBody(p, px, py) {
  const x = PAD + (px + .5) * S, y = PAD + (py + .5) * S, r = S * .3;
  ctx.globalAlpha = p.wait > 0 && Math.floor(clock * 6) % 2 ? .45 : 1;
  if (p.role === 'catcher') {               // red spikes mark a catcher
    const spikes = 10, spin = clock * 1.5;
    ctx.fillStyle = '#FF4D4D';
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const a = spin + i * Math.PI / spikes, rad = i % 2 ? r * 1.05 : r * 1.5;
      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
  }
  if (clock - p.pushingAt < .12) {          // dust kicks up behind a pusher
    ctx.fillStyle = '#A9ADB8';
    for (const n of [0, 1, 2]) {
      const back = r * (1.3 + .25 * n), side = Math.sin(clock * 20 + n * 2) * r * .4;
      ctx.beginPath();
      ctx.arc(x - DX[p.face] * back + DY[p.face] * side, y - DY[p.face] * back + DX[p.face] * side, r * .13, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  const fx = DX[p.face], fy = DY[p.face];        // eyes look where the player is heading
  const sx = -fy * r * .4, sy = fx * r * .4;
  for (const side of [-1, 1]) {
    const ex = x + fx * r * .4 + sx * side, ey = y + fy * r * .4 + sy * side;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex, ey, r * .27, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#16181D';
    ctx.beginPath(); ctx.arc(ex + fx * r * .1, ey + fy * r * .1, r * .13, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRings() {
  for (const ring of rings) {
    const k = ring.age / .7;
    ctx.globalAlpha = Math.max(0, 1 - k);
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(PAD + (ring.x + .5) * S, PAD + (ring.y + .5) * S, S * (.4 + k * 1.2), 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  drawMaze();
  runners().forEach(drawPlayer);
  catchers().forEach(drawPlayer);   // catchers on top
  drawRings();
}

let last = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000 || 0, .05);
  last = now;
  if (net.mode === 'guest') guestTick(dt);
  else {
    update(dt);
    if (net.mode === 'host') hostTick(dt);
  }
  draw();
  requestAnimationFrame(frame);
}

renderOverlay();
renderHud();
requestAnimationFrame(frame);
// A link with a game code on the end, like maze-catch/#ABCD, joins that game straight away.
const hashCode = location.hash.match(/^#([A-HJ-NP-Z]{4})$/i);
if (hashCode) joinGame(hashCode[1]);
</script>
</body>
</html>
